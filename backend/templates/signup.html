<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAROL — Criar Conta</title>
    <link rel="icon" href="/static/images/fi.png" type="image/png">
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        body { justify-content: center; align-items: center; }
        .auth-box {
            background: var(--surface);
            border: 1px solid var(--border2);
            border-radius: 18px;
            padding: 40px 36px;
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .auth-box img   { width: 90px; margin: 0 auto 4px; display: block; }
        .auth-box h2    { font-family: var(--mono); color: var(--accent); font-size: 13px; text-align: center; letter-spacing: 0.1em; }
        .auth-box input {
            width: 100%; padding: 11px 15px;
            border-radius: 10px; border: 1px solid var(--border2);
            background: var(--bg); color: var(--text);
            font-size: 14px; font-family: var(--sans);
        }
        .auth-box input:focus  { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
        .auth-box input::placeholder { color: var(--text-muted); }
        .auth-box button       { width: 100%; height: 44px; font-size: 14px; border-radius: 12px; }
        .auth-switch           { text-align: center; font-size: 12px; color: var(--text-muted); font-family: var(--mono); }
        .auth-switch a         { color: var(--accent); text-decoration: none; }
        .auth-switch a:hover   { text-decoration: underline; }
        .auth-error            { color: var(--error); font-size: 12px; font-family: var(--mono); text-align: center; min-height: 16px; }
        .auth-success          { color: var(--green); font-size: 12px; font-family: var(--mono); text-align: center; min-height: 16px; }
    </style>
</head>
<body>
    <div class="auth-box">
        <img src="/static/images/farol.png" alt="FAROL">
        <h2>CRIAR CONTA</h2>
        <p class="auth-error"   id="errorMsg"></p>
        <p class="auth-success" id="successMsg"></p>
        <input type="email"    id="email"    placeholder="Email"              autocomplete="email">
        <input type="password" id="password" placeholder="Password"           autocomplete="new-password">
        <input type="password" id="confirm"  placeholder="Confirmar password" autocomplete="new-password">
        <button id="signupBtn">Criar conta</button>
        <p class="auth-switch">Já tem conta? <a href="/login">Entrar</a></p>
    </div>
    <script>
        async function doSignup() {
            const email      = document.getElementById('email').value.trim();
            const password   = document.getElementById('password').value;
            const confirm    = document.getElementById('confirm').value;
            const errorMsg   = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');
            errorMsg.textContent = '';
            successMsg.textContent = '';

            if (!email || !password || !confirm) { errorMsg.textContent = 'Preencha todos os campos.'; return; }
            if (password !== confirm)             { errorMsg.textContent = 'As passwords não coincidem.'; return; }
            if (password.length < 6)             { errorMsg.textContent = 'Mínimo 6 caracteres.'; return; }

            try {
                const res  = await fetch('/api/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password }),
                });
                const data = await res.json();
                if (!res.ok) { errorMsg.textContent = data.message || 'Erro ao criar conta.'; return; }
                successMsg.textContent = 'Conta criada! Redirecionando...';
                setTimeout(() => window.location.href = '/login', 1500);
            } catch {
                errorMsg.textContent = 'Erro de conexão.';
            }
        }

        document.getElementById('signupBtn').addEventListener('click', doSignup);
        document.addEventListener('keydown', e => { if (e.key === 'Enter') doSignup(); });
    </script>
</body>
</html>
